---
- name: Apply defaults
  ansible.builtin.set_fact:
    disk_mount: "{{ disk_mount | default('/') }}"
    disk_warn_threshold: "{{ disk_warn_threshold | default(80) }}"
    disk_critical_threshold: "{{ disk_critical_threshold | default(95) }}"
    _test_disk_use_percent: "{{ test_disk_use_percent | default('') | string | trim }}"

- name: Use test disk use percent (skip live df)
  ansible.builtin.set_fact:
    disk_use_percent: "{{ _test_disk_use_percent | int }}"
  when: _test_disk_use_percent | length > 0

# Prefer df over ansible_mounts: container EEs (AAP 2.7 supported EE) often
# expose only /runner in ansible_mounts while / is an overlay that df sees.
# See https://github.com/ansible-tmm/aap-orchestrator-demos/issues/8
- name: Read disk usage with df
  ansible.builtin.command:
    argv:
      - df
      - -P
      - "{{ disk_mount }}"
  register: disk_df
  changed_when: false
  failed_when: false
  when: _test_disk_use_percent | length == 0

- name: Fail when mount is missing
  ansible.builtin.fail:
    msg: "Mount {{ disk_mount }} not found on {{ inventory_hostname }}."
  when:
    - _test_disk_use_percent | length == 0
    - >-
      (disk_df.rc | default(1) | int) != 0
      or (disk_df.stdout_lines | default([]) | length) < 2

- name: Calculate disk use percent for mount
  ansible.builtin.set_fact:
    disk_use_percent: >-
      {{
        disk_df.stdout_lines[1].split()[4]
        | regex_replace('%', '')
        | int
      }}
  when: _test_disk_use_percent | length == 0

- name: Bucket disk use into switch tier
  ansible.builtin.set_fact:
    disk_tier: >-
      {%- set pct = disk_use_percent | int -%}
      {%- if pct < (disk_warn_threshold | int) -%}
      ok
      {%- elif pct <= (disk_critical_threshold | int) -%}
      warn
      {%- else -%}
      critical
      {%- endif -%}

- name: Debug disk_use_percent type before set_stats
  ansible.builtin.debug:
    msg:
      - "value={{ disk_use_percent }}"
      - "type={{ disk_use_percent | type_debug }}"
      - "int type={{ (disk_use_percent | int) | type_debug }}"

- name: Publish check artifacts for AO switch
  ansible.builtin.set_stats:
    data: "{{ {'disk_mount': disk_mount, 'disk_tier': disk_tier | trim, 'disk_use_percent': disk_use_percent | int, 'notify_host': ansible_play_hosts | join(',')} }}"
    per_host: false
    aggregate: false
  run_once: true

- name: Show detected disk tier
  ansible.builtin.debug:
    msg: >-
      {%- if _test_disk_use_percent | length > 0 -%}
      [TEST] Simulated {{ disk_mount }} at {{ disk_use_percent }}% full → disk_tier={{ disk_tier }}
      {%- else -%}
      {{ disk_mount }} is {{ disk_use_percent }}% full → disk_tier={{ disk_tier }}
      {%- endif -%}

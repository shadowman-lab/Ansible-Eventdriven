---
- name: Get VM info
  vmware.vmware.guest_info:
    name: "{{ inventory_hostname }}"
    datacenter: "Shadowman-DC"
    validate_certs: false
  register: vm_info
  delegate_to: localhost

- name: Retrieve the memory information from the VM
  vmware.vmware.vm_resource_info:
    moid: "{{ vm_info.guests[0].moid }}"
    validate_certs: false
  register: vm_resource
  delegate_to: localhost

- name: Turn off VM
  vmware.vmware.vm_powerstate:
    moid: "{{ vm_info.guests[0].moid }}"
    datacenter: "Shadowman-DC"
    state: powered-off
    validate_certs: false
  delegate_to: localhost
  when: vm_resource.vms[0].memory.size_mb | int != memory | int

- name: Restore memory for the VM
  vmware.vmware.vm:
    moid: "{{ vm_info.guests[0].moid }}"
    datacenter: "Shadowman-DC"
    memory:
      size_mb: "{{ memory }}"
    validate_certs: false
  delegate_to: localhost
  when: vm_resource.vms[0].memory.size_mb | int != memory | int

- name: Turn on VM
  vmware.vmware.vm_powerstate:
    moid: "{{ vm_info.guests[0].moid }}"
    datacenter: "Shadowman-DC"
    state: powered-on
    validate_certs: false
  delegate_to: localhost
  when: vm_resource.vms[0].memory.size_mb | int != memory | int

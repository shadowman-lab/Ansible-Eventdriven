---
- name: Get VM info
  vmware.vmware.guest_info:
    name: "{{ inventory_hostname }}"
    datacenter: "Shadowman-DC"
    validate_certs: false
  register: vm_info
  delegate_to: localhost

- name: Retrieve the CPU information from the VM
  vmware.vmware.vm_resource_info:
    moid: "{{ vm_info.guests[0].moid }}"
    validate_certs: false
  register: vm_resource
  delegate_to: localhost

- name: Retrieve Max Allowed Cores
  servicenow.itsm.configuration_item_info:
    sys_class_name: cmdb_ci_server
    return_fields:
      - u_cpu_core_max
    name: "{{ inventory_hostname }}"
  register: cpu_core_max_result
  delegate_to: localhost

- name: Add one core to the VM if under the max
  vmware.vmware.vm:
    moid: "{{ vm_info.guests[0].moid }}"
    datacenter: "Shadowman-DC"
    cpu:
      cores: "{{ vm_resource.vms[0].cpu.processor_count | int + 1 }}"
    validate_certs: false
  delegate_to: localhost
  when: vm_resource.vms[0].cpu.processor_count | int < cpu_core_max_result.records[0].u_cpu_core_max | int

- name: Pass Updates if cores updated
  ansible.builtin.set_stats:
    data:
      sn_urgency: medium
      sn_impact: medium
      comment: "CPU increased, manual log review required"
  when: vm_resource.vms[0].cpu.processor_count | int < cpu_core_max_result.records[0].u_cpu_core_max | int

- name: Pass Updates if cores at limit
  ansible.builtin.set_stats:
    data:
      sn_urgency: high
      sn_impact: high
      comment: "CPU NOT increased, full manual intervention required"
  when: vm_resource.vms[0].cpu.processor_count | int >= cpu_core_max_result.records[0].u_cpu_core_max | int
